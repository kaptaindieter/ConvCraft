[package]
name = "vf-cli"
description = "voidflare on the command line: formats, convert, and the MCP server for LLMs. No window."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "voidflare-cli"
path = "src/main.rs"

[dependencies]
vf-core.workspace = true
serde_json = "1.0.154"

# Puts the product name and the version into the exe (the release check reads them).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
