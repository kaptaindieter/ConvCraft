name: build

# Builds the portable package from a clean Windows machine: the engines come from their official releases at the
# versions pinned in src/engines.json (hash-checked), CADCraft is built from source with our patch, then the hub
# and the apps are built and packed. Nothing here depends on anything installed by hand.
#
#   push / pull request   build and test; the release files (full bundle, hub, one ZIP per app and per engine,
#                         manifest.json, SHA256SUMS.txt) are kept as a build artifact for 14 days
#   tag v*                the same, then all of those files are published as a GitHub release
#   manual                Actions tab, "Run workflow"
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["src/**", ".github/workflows/build.yml", "CHANGELOG.md"]
  pull_request:
    paths: ["src/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Cargo downloads and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Engines (pinned, hash-checked) and CADCraft with our patch
        working-directory: src
        run: ./fetch-engines.ps1 -BuildCadcraft

      - name: Tests
        working-directory: src
        env:
          # the tests that need an engine use the ones just fetched
          VOIDFLARE_WORDCRAFT: ${{ github.workspace }}/src/engines/wordcraft/wordcraft-cli.exe
          VOIDFLARE_GRIDCRAFT: ${{ github.workspace }}/src/engines/gridcraft/gridcraft-cli.exe
          VOIDFLARE_DECKCRAFT: ${{ github.workspace }}/src/engines/deckcraft/deckcraft-cli.exe
          VOIDFLARE_PDFCRAFT: ${{ github.workspace }}/src/engines/pdfcraft/pdfcraft-cli.exe
          VOIDFLARE_CADCRAFT: ${{ github.workspace }}/src/engines/cadcraft/cadcraft-cli.exe
        run: cargo test --release --workspace

      - name: Build the hub and the apps
        working-directory: src
        run: ./build-apps.ps1

      # A v* tag must match the version in src/Cargo.toml (release.ps1 then checks every exe carries it).
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Select-String -Path src/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME but src/Cargo.toml says $v" }

      - name: Pack the release files
        working-directory: src
        run: ./release.ps1

      # Installs every pack from the files just written and runs its bundled engine, as the hub will.
      - name: Check the release files
        working-directory: src
        run: cargo test --release -p vf-core --test release_assets -- --nocapture

      # Code signing goes here once the project is accepted by the SignPath Foundation (free for open source):
      # the unsigned executables are submitted with signpath/github-action-submit-signing-request and the signed
      # ones replace them before the packing step. Not set up yet.

      - uses: actions/upload-artifact@v4
        with:
          name: voidflare-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: voidflare-windows
          path: release

      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No section for $version in CHANGELOG.md" >&2; exit 1; fi
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every file the hub needs. Names all start with "voidflare-" and the full bundle sorts first, because a
          # 0.1.0 hub takes the first ZIP of a release.
          # A release created by hand for this tag is left alone: replacing its files would change hashes people may
          # already have checked.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, not touching it."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "voidflare ${GITHUB_REF_NAME#v}" --notes-file notes.md
